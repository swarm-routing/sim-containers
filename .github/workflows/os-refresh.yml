name: OS refresh

# The OS security refresh, automated (#218, #27): once a day, Trivy (the pin of
# test/run.sh's security stage) scans the published rolling images of the
# supported release (the first latest-* tag of each entry tools/ns3_matrix.py
# --tier latest yields) for vulnerabilities with a fix. The org's Go tool
# os-refresh (swarm-routing/.github cmd/os-refresh, in the ci-tools image by
# digest) reads the reports: when an OS package has a fixable finding of MEDIUM
# or higher, the security stage's threshold, it dispatches the existing refresh
# path, publish-images.yml with `refresh: true` on main. That run builds,
# tests and promotes by digest like any other (golden rule 17); this workflow
# builds nothing. The dispatch takes the org bot's token: one made with the
# workflow token would start no run.
#
# At most one refresh a day: no dispatch while a publish-images.yml run on main
# is queued or in progress, or when a dispatch of it (manual or automated)
# was created earlier the same UTC day. A failed automated refresh opens, or
# adds its run link to, the one open "OS security refresh failed" issue on the
# next scan; a successful one closes it. The run summary lists the fixable
# findings per image and the distinct CVEs by severity.
#
#   schedule (daily)                      scan, then refresh when needed
#   workflow_dispatch dry-run: true       scan, print what it would do, write nothing
#   workflow_dispatch                     as the schedule
on:
  schedule:
    - cron: '23 5 * * *'   # daily 05:23 UTC, after candidates-cleanup (04:41)
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Scan and print what it would refresh; dispatch nothing, open no issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: os-refresh
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ns3-dev
  # Same pin as test/run.sh's security stage and publish-images.yml.
  TRIVY: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  # swarm-routing/.github's ci-tools image, promoted from fe683ae (swarm-routing/.github#712, cmd/os-refresh)
  CI_TOOLS: ghcr.io/swarm-routing/ci-tools@sha256:5d999adf7dbb47e52e725c0549cbc54c53354ed24289e758a9311dde986a4a4e

jobs:
  scan:
    name: scan the rolling images, refresh when fixable
    if: github.repository == 'swarm-routing/sim-containers'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read   # checkout, for tools/ns3_matrix.py
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: The rolling images of the supported release
        timeout-minutes: 3
        run: |
          python3 tools/ns3_matrix.py --tier latest \
            | jq -r '.include[] | .latest_tags | split(" ")[0] | select(. != "")' > "$RUNNER_TEMP/tags.txt"
          [ -s "$RUNNER_TEMP/tags.txt" ] || { echo "::error::tools/ns3_matrix.py --tier latest gave no latest tag"; exit 1; }
          cat "$RUNNER_TEMP/tags.txt"
      - name: Download Trivy's vulnerability database
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache" "$TRIVY" image --download-db-only --no-progress
      # Every vulnerability scanner of the security stage's first check, so a
      # fixable finding outside OS packages is reported too; only OS packages
      # trigger a refresh (os-refresh reads the class). Remote: Trivy reads the
      # public image from the registry, no `docker pull`. A tag that cannot be
      # scanned (an experimental image never promoted) is a warning; no report
      # at all fails the job.
      - name: Scan each rolling image (Trivy, pinned by digest)
        timeout-minutes: 60
        run: |
          mkdir -p reports
          while read -r tag; do
            echo "::group::$IMAGE:$tag"
            if docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache" -e TRIVY_SKIP_DB_UPDATE=true "$TRIVY" \
                 image --quiet --image-src remote --scanners vuln --format json --exit-code 0 \
                 "$IMAGE:$tag" > "reports/$tag.json"; then
              echo "scanned"
            else
              echo "::warning::$IMAGE:$tag could not be scanned: left out"
              rm -f "reports/$tag.json"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/tags.txt"
          ls reports/*.json > /dev/null 2>&1 || { echo "::error::no image could be scanned"; exit 1; }
      - name: Pull the ci-tools image (with retries)
        uses: swarm-routing/.github/.github/actions/pull-ci-tools@9a1ce0ffeda6916186f97b0c5a7678bcbc7578ad # main@2026-11-24
        timeout-minutes: 3   # a pull of about 15 MB and up to 90 s of retries
        with:
          image: ${{ env.CI_TOOLS }}
      - name: Bot token (dispatches publish-images.yml, keeps the failure issue)
        id: bot
        continue-on-error: true
        timeout-minutes: 2
        uses: swarm-routing/.github/.github/actions/bot-token@9a1ce0ffeda6916186f97b0c5a7678bcbc7578ad # main@2026-11-24
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.ORG_BOT_TOKEN }}
      - name: Decide, and dispatch the refresh when needed
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          ACTOR: ${{ steps.bot.outputs.git-name }}
          DRY: ${{ inputs.dry-run == true }}
        run: |
          set -o pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          [ -n "$ACTOR" ] && args+=(--actor "$ACTOR")
          if [ "$DRY" = true ]; then
            args+=(--dry-run)
          elif [ -z "$GH_TOKEN" ]; then
            echo "::error::no bot token: the refresh cannot be dispatched (a workflow-token dispatch starts no run)"
            exit 1
          fi
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/github/workspace:ro" -w /github/workspace \
            "$CI_TOOLS" os-refresh "${args[@]}" reports/*.json | tee -a "$GITHUB_STEP_SUMMARY"
