name: Licence

# AntHocNet's per-directory licence rules (LICENSING.md): the image tooling is
# MIT OR GPL-2.0-only; the ns-3 fixture module and everything else GPL-2.0-only.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@4ca39e56878af1b23a028c602d554a6f696b2ac2 # main@2026-11-27
    with:
      dual-roots: docker/ test/smoke.sh test/run.sh test/structure.sh test/integration.sh test/profile.sh test/unit.sh test/downstream.sh test/protocol.sh test/patches.sh tools/ .github/workflows/
      core-roots: ''
